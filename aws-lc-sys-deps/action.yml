name: Setup aws-lc-sys dependencies (Windows)
description: On Windows, makes aws-lc-sys use its bundled prebuilt NASM objects, so no NASM install is needed

runs:
  using: composite
  steps:
    # aws-lc-sys only needs NASM on x86_64 Windows, and ships prebuilt objects
    # for it. rustls's aws_lc_rs feature already enables them; the variable
    # keeps that true for any other path to aws-lc-sys. It is ignored on
    # other targets. FIPS builds (aws-lc-fips-sys) are not supported.
    - name: Use prebuilt NASM objects for aws-lc-sys
      if: runner.os == 'Windows'
      shell: pwsh
      run: echo "AWS_LC_SYS_PREBUILT_NASM=1" | Out-File -FilePath $env:GITHUB_ENV -Append
