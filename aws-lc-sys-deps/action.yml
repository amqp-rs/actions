name: Setup aws-lc-sys dependencies (Windows)
description: Installs NASM and checks for Ninja on Windows for aws-lc-rs / aws-lc-fips-sys

runs:
  using: composite
  steps:
    - name: Install NASM for aws-lc-rs on Windows
      if: runner.os == 'Windows'
      uses: ilammy/setup-nasm@v1

    - name: Check Ninja for aws-lc-fips-sys on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: ninja --version
