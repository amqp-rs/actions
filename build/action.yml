name: Build and test
description: Installs a Rust toolchain, checks every feature with cargo-hack, and runs cargo test

inputs:
  rust:
    description: Rust toolchain version (stable, nightly, beta, msrv, or an explicit version like 1.88.0)
    required: false
    default: stable
  check:
    description: Run the cargo check steps
    required: false
    default: 'true'
  test:
    description: Run cargo test
    required: false
    default: 'true'
  test-features:
    description: Extra feature sets to test, one per line; each runs cargo test --no-default-features --features <set>
    required: false
    default: ''
  test-args:
    description: Extra arguments for every cargo test run (e.g. --lib, or -p <package> in a virtual workspace)
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Read MSRV from Cargo.toml
      id: msrv
      if: inputs.rust == 'msrv'
      shell: bash
      run: |
        # cargo metadata resolves every valid TOML spelling and workspace
        # inheritance; the runner image's preinstalled cargo is enough here.
        versions=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[].rust_version | select(. != null)] | unique | .[]')
        case $(wc -w <<< "$versions") in
          1) echo "version=$versions" >> "$GITHUB_OUTPUT" ;;
          0) echo "::error file=Cargo.toml::rust: msrv needs a rust-version in Cargo.toml"; exit 1 ;;
          *) echo "::error file=Cargo.toml::rust: msrv needs a single rust-version across the workspace, found: ${versions//$'\n'/, }"; exit 1 ;;
        esac

    # @master, not @stable: upstream recommends it whenever the toolchain is
    # passed as an input.
    - uses: dtolnay/rust-toolchain@master
      id: toolchain
      with:
        toolchain: ${{ inputs.rust == 'msrv' && steps.msrv.outputs.version || inputs.rust }}

    # rust-cache keys on every installed rustc, so a nightly entry can only be
    # restored by reruns on the same nightly: do not upload one per day.
    - uses: Swatinem/rust-cache@v2
      with:
        save-if: ${{ inputs.rust != 'nightly' }}

    - name: Pin the toolchain and deny warnings
      shell: bash
      env:
        RUST: ${{ inputs.rust }}
        TOOLCHAIN: ${{ steps.toolchain.outputs.name }}
      run: |
        # A rust-toolchain(.toml) file would otherwise override the toolchain
        # selected above for every cargo call, msrv/beta/nightly included.
        echo "RUSTUP_TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
        # Toolchains older than stable do not know the newest lints, so an
        # `allow` for one would fail as `unknown_lints` under `-D warnings`.
        case $RUST in
          stable|beta|nightly) deny="-D warnings" ;;
          *) deny="-D warnings -A unknown_lints" ;;
        esac
        # Extend, rather than replace, RUSTFLAGS set by the calling job.
        echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }$deny" >> "$GITHUB_ENV"

    - uses: taiki-e/install-action@v2
      if: inputs.check == 'true' && inputs.rust != 'beta' && inputs.rust != 'nightly'
      with:
        # Pinned, see "Pinned tool versions" in AGENTS.md.
        tool: cargo-hack@0.6.45

    # --all-targets includes the library as users build it; --bins --examples
    # --tests alone only compiled it as a unit-test harness.
    - name: Check each feature
      if: inputs.check == 'true' && inputs.rust != 'beta' && inputs.rust != 'nightly'
      shell: bash
      run: cargo hack check --each-feature --workspace --all-targets --locked

    # On beta and nightly the sweep would re-check stable's code feature by
    # feature with a cold cache; the two extreme feature sets are enough to
    # catch compiler-version regressions.
    - name: Check with all and with no default features
      if: inputs.check == 'true' && (inputs.rust == 'beta' || inputs.rust == 'nightly')
      shell: bash
      run: |
        cargo check --workspace --all-targets --locked --all-features
        cargo check --workspace --all-targets --locked --no-default-features

    # The checks above unify dev-dependency features into every build, which
    # hides a feature missing from [dependencies]. --no-dev-deps cannot be
    # combined with --locked (dropping them changes the resolve); cargo-hack
    # restores Cargo.toml and Cargo.lock when it is done.
    - name: Check each feature without dev-dependencies
      if: inputs.check == 'true' && inputs.rust == 'stable'
      shell: bash
      run: cargo hack check --each-feature --workspace --no-dev-deps

    - name: Run cargo test
      if: inputs.test == 'true'
      shell: bash
      env:
        TEST_ARGS: ${{ inputs.test-args }}
      run: |
        read -ra args <<< "$TEST_ARGS"
        cargo test --locked "${args[@]}"

    - name: Run cargo test for each extra feature set
      if: inputs.test == 'true' && inputs.test-features != ''
      shell: bash
      env:
        TEST_ARGS: ${{ inputs.test-args }}
        TEST_FEATURES: ${{ inputs.test-features }}
      run: |
        read -ra args <<< "$TEST_ARGS"
        while read -r features; do
          [ -n "$features" ] || continue
          echo "::group::cargo test --no-default-features --features '$features'"
          cargo test --locked --no-default-features --features "$features" "${args[@]}"
          echo "::endgroup::"
        done <<< "$TEST_FEATURES"
