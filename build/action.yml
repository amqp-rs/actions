name: Build and test
description: Installs a Rust toolchain, runs cargo check and cargo test

inputs:
  rust:
    description: Rust toolchain version (stable, nightly, beta, msrv, or an explicit version like 1.88.0)
    required: false
    default: stable
  check:
    description: Run cargo check steps
    required: false
    default: 'true'
  test:
    description: Run cargo test
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Extract MSRV from Cargo.toml
      id: msrv
      shell: bash
      run: |
        version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust == 'msrv' && steps.msrv.outputs.version || inputs.rust }}

    - uses: Swatinem/rust-cache@v2

    - name: Set RUSTFLAGS
      shell: bash
      run: echo "RUSTFLAGS=-D warnings" >> "$GITHUB_ENV"

    - uses: taiki-e/install-action@v2.85.5
      if: inputs.check == 'true'
      with:
        tool: cargo-hack

    - name: Run cargo check
      if: inputs.check == 'true'
      shell: bash
      run: cargo hack check --each-feature --all --bins --examples --tests

    - name: Run cargo check (without dev-dependencies to catch missing feature flags)
      if: inputs.check == 'true' && inputs.rust == 'nightly'
      shell: bash
      run: cargo check -Z features=dev_dep

    - name: Run cargo test
      if: inputs.test == 'true'
      shell: bash
      run: cargo test
