name: Build and test
description: Installs a Rust toolchain, runs cargo check and cargo test

inputs:
  rust:
    description: Rust toolchain version (stable, nightly, beta, or an MSRV like 1.88.0)
    required: false
    default: stable
  check:
    description: Run cargo check steps
    required: false
    default: 'true'
  test:
    description: Run cargo test
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.rust }}

    - uses: Swatinem/rust-cache@v2

    - name: Set RUSTFLAGS
      shell: bash
      run: echo "RUSTFLAGS=-D warnings" >> "$GITHUB_ENV"

    - name: Run cargo check
      if: inputs.check == 'true'
      shell: bash
      run: cargo check --all --bins --examples --tests --all-features

    - name: Run cargo check (without dev-dependencies to catch missing feature flags)
      if: inputs.check == 'true' && inputs.rust == 'nightly'
      shell: bash
      run: cargo check -Z features=dev_dep

    - name: Run cargo test
      if: inputs.test == 'true'
      shell: bash
      run: cargo test
