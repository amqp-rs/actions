name: Self-test

# Runs this commit's actions (`./<name>`, not `amqp-rs/actions/<name>@main`)
# and reusable workflows on the fixture crate in self-test/, the workspace at
# the repository root, so a change is exercised before it reaches every
# consumer through @main.

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.rust == 'nightly' }}
    env:
      # The build action keeps the job's flags: the fixture's rustflags test
      # fails without this one.
      RUSTFLAGS: --cfg fixture_rustflags
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: nightly
          - os: ubuntu-latest
            rust: beta
          - os: ubuntu-latest
            rust: msrv
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./checkout
      # The sub-actions directly: windows-setup-tls-env itself pulls them
      # from @main, so it cannot test a change to them.
      - uses: ./aws-lc-sys-deps
      - uses: ./openssl-vcpkg
      - uses: ./openssl-no-vendor
      - uses: ./build
        with:
          rust: ${{ matrix.rust }}
          test-features: shout
          test-runs: |
            --test greeting
            --test rustflags -- --ignored

  # How build/run-tests.sh composes and runs cargo test, against a stub cargo.
  # macOS runs it with bash 3.2.
  run-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check the cargo test invocations
        shell: bash
        run: self-test/check-run-tests.sh

  # The build action must fail when a test run fails, after running the others.
  build-failure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The fixture's greeting test appends its greeting to this file.
      - name: Record the greetings of the test runs
        shell: bash
        run: echo "FIXTURE_GREETINGS=$RUNNER_TEMP/greetings" >> "$GITHUB_ENV"
      - uses: ./build
        id: build
        continue-on-error: true
        with:
          check: 'false'
          test-runs: |
            --features no-such-feature
            --features shout --test greeting
      # The default run's greeting, none from the failed run, then the last
      # run's. A failure before the test runs leaves none, and one that stops
      # them leaves out the last.
      - name: Check that the failed run failed the build, after the last run
        shell: bash
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          if [ "$OUTCOME" != failure ]; then
            echo "::error::the build action passed although a test run failed"
            exit 1
          fi
          diff -u <(printf 'hello\nHELLO\n') "$FIXTURE_GREETINGS"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./lint

  windows-setup-tls-env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Only checks that the aggregate loads: its sub-actions come from @main
      # and are no-ops off Windows.
      - uses: ./windows-setup-tls-env

  # This commit's reusable workflows. They run the actions from @main: the
  # jobs above cover this commit's.
  reusable-actionlint:
    uses: ./.github/workflows/reusable-actionlint.yml

  reusable-lint:
    uses: ./.github/workflows/reusable-lint.yml

  reusable-build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      setup: aws-lc-sys-deps
      # The fixture's rustflags test fails where this flag does not reach rustc.
      rustflags: --cfg fixture_rustflags
      test-features: shout
      test-runs: --test rustflags -- --ignored
      linux-stable-test-runs: --test greeting
