name: Security audit (reusable)

# Called from a crate repository's workflow, which keeps its own triggers
# (push, pull_request and a schedule). A called workflow can only narrow the
# token of its caller, so the calling job grants the widest set and each job
# here keeps what it needs:
#
#   jobs:
#     security:
#       permissions:
#         contents: read
#         checks: write
#         issues: write
#       uses: amqp-rs/actions/.github/workflows/reusable-security.yml@main

on:
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: amqp-rs/actions/checkout@main
      - uses: amqp-rs/actions/security@main

  # Only the scheduled audit opens issues.
  scheduled-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: amqp-rs/actions/checkout@main
      - uses: amqp-rs/actions/security@main
