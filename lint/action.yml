name: Lint
description: Runs clippy and rustdoc on every feature set with warnings denied, and checks formatting, on stable Rust

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      id: toolchain
      with:
        components: clippy, rustfmt

    - uses: Swatinem/rust-cache@v2

    - uses: taiki-e/install-action@v2
      id: cargo-hack
      with:
        # Latest 0.6.x, see "Tool versions" in AGENTS.md.
        tool: cargo-hack@0.6

    # Per feature set, so code only compiled when a feature is off is linted
    # too; --all-targets covers tests, examples and benches.
    - name: Run clippy on each feature
      shell: bash
      env:
        # Link the image's OpenSSL; the build jobs cover the vendored one.
        OPENSSL_NO_VENDOR: '1'
      run: cargo hack clippy --each-feature --workspace --all-targets --locked -- -D warnings

    # The remaining checks run even when clippy fails, so one push reports
    # every problem.
    - name: Check formatting
      if: ${{ !cancelled() && steps.toolchain.outcome == 'success' }}
      shell: bash
      run: cargo fmt --all -- --check

    - name: Check documentation on each feature
      if: ${{ !cancelled() && steps.cargo-hack.outcome == 'success' }}
      shell: bash
      env:
        # Link the image's OpenSSL; the build jobs cover the vendored one.
        OPENSSL_NO_VENDOR: '1'
        RUSTDOCFLAGS: -D warnings
      run: cargo hack doc --each-feature --workspace --no-deps --document-private-items --locked
