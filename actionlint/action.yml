name: actionlint
description: Lints GitHub Actions workflow files with actionlint

runs:
  using: composite
  steps:
    - uses: raven-actions/actionlint@v2
      with:
        # Pinned so a new actionlint check cannot turn every repository red at
        # once; bump it here by hand (Dependabot does not track this input).
        version: 1.7.12
        # pyflakes only checks `shell: python` steps, which no workflow has.
        pyflakes: false
